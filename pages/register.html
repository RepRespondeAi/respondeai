<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responde aí!</title>
    <link rel="stylesheet" href="../assets/css/core.css">
    <link rel="stylesheet" href="../assets/css/auth.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        
        <a class="logo" href="/">
            <h1>Responde aí</h1>
        </a>
        
        <div class="searchbox">
            <img src="../assets/images/icons/lupa.png" alt="">
            <input type="search" name="" id="" placeholder="Buscar dúvidas ou mentores">
        </div>

        <div class="profile">
            <button><img src="../assets/images/icons/sino.png" alt="Notificações"></button>
            
            <div class="profile-dropdown">
                <button class="profile-trigger"><img src="../assets/images/icons/perfil.png" alt="Perfil"></button>
                <div class="dropdown-menu">
                    <a href="pages/login.html">Login</a>
                    <a href="pages/register.html">Cadastrar-se</a>
                </div>
            </div>
        </div>
    </header>


    <div class="layout">


        
        <main>

            <section class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Crie sua conta</h1>
            <p>Junte-se à maior comunidade acadêmica do Brasil.</p>
        </div>

        <form class="auth-form">
            <div class="form-group">
                <label for="name">Nome Completo</label>
                <input type="text" id="name" placeholder="Como quer ser chamado?" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@melhoremail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Crie uma senha forte" required>
            </div>

            <button type="submit" class="btn-auth-primary">Criar Conta</button>
        </form>

        <div class="auth-footer">
            <p>Ao se cadastrar, você concorda com nossos <a href="#">Termos de Uso</a>.</p>
            <p class="mt-1">Já possui conta? <a href="login.html">Faça login</a></p>
        </div>
    </div>
</section>

        </main>

    </div>

    <footer>
    <div class="footer-left">
        <h2>Responde Aí</h2>
        <p>© 2024 Responde Aí - Excelência Acadêmica</p>
    </div>

    <nav class="footer-links">
        <a href="#">Privacidade</a>
        <a href="#">Termos</a>
        <a href="#">Ajuda</a>
    </nav>

    <div class="footer-social">
        <a href="#">
            <img src="../assets/images/icons/facebook_icon.png" alt="Discord">
        </a>

        <a href="#">
            <img src="../assets/images/icons/instagram_icon.png" alt="GitHub">
        </a>

        <a href="#">
            <img src="../assets/images/icons/twitter_icon.png" alt="Perfil">
        </a>
    </div>
</footer>
</body>
</html>
