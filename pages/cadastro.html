<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RespondeAi</title>
    <link rel="stylesheet" href="../assets/css/cadastro.css">
</head>
<body>
    <div id="formulario">
        <h1>Cadastro no RespondeAi</h1>
        <hr>
        <br>
       <form id="form">
            <div>
                <label for="nome" id="labelnome" class="label">Nome Completo:</label>
                <input type="text" id="nome" name="nome" class="input" required>
            </div>
            <br>
            <div>
                <label for="email" id="labelemail" class="label">Email:</label>
                <input type="email" id="email" name="email" class="input" required>
            </div>
            <br>
            <div>
                <label for="senha" id="labelsenha" class="label">Senha:</label>
                <input type="password" id="senha" name="senha" class="input" required>
            </div>
            <br>
            <div>
                <label for="data" id="labeldata" class="label">Data de Nascimento:</label>
                <input type="date" id="data" name="data" class="input" required>
            </div>
            <br>
            <div>
                <label for="cpf" id="labelcpf" class="label">CPF:</label>
                <input type="number" id="cpf" name="cpf" oninput="if(this.value.length > 11) this.value = this.value.slice(0, 11);" class="input" required>
            </div>
            <br>
            <div id="endereco">
                <label for="estado" id="labelestado" class="label">Estado:</label>
                <select id="estado" name="estado" required>
                    <option value="">--</option>
                    <option value="ac">AC</option>
                    <option value="al">AL</option>
                    <option value="ap">AP</option>
                    <option value="am">AM</option>
                    <option value="ba">BA</option>
                    <option value="ce">CE</option>
                    <option value="df">DF</option>
                    <option value="es">ES</option>
                    <option value="go">GO</option>
                    <option value="ma">MA</option>
                    <option value="mt">MT</option>
                    <option value="ms">MS</option>
                    <option value="mg">MG</option>
                    <option value="pa">PA</option>
                    <option value="pb">PB</option>
                    <option value="pr">PR</option>
                    <option value="pe">PE</option>
                    <option value="pi">PI</option>
                    <option value="rj">RJ</option>
                    <option value="rn">RN</option>
                    <option value="rs">RS</option>
                    <option value="ro">RO</option>
                    <option value="rr">RR</option>
                    <option value="sc">SC</option>
                    <option value="sp">SP</option>
                    <option value="se">SE</option>
                    <option value="to">TO</option>
                </select>
                <label for="cidade" id="labelcidade" class="label">Cidade:</label>
                <input type="text" id="cidade" name="cidade" class="input" required>
            </div>
            <br>
            <div id="botoes">
                <button type="reset" id="limpar">Limpar Tudo</button>
                <button type="submit" id="cadastro">Cadastrar</button>
            </div>
        </form>    
    </div>

<script src="../assets/js/cadastro.js"></script>

</body>
</html>
